[workspace.package]
edition = "2024"

[workspace]
resolver = "3"
members = [
    "crates/vulkan-renderer",
    "crates/renderer",

    "crates/engine",
    "crates/math",
    "crates/window",
    "crates/editor",
]

[workspace.dependencies]
# Local crates
vulkan-renderer = { version = "0.1.0", path = "./crates/vulkan-renderer" }

engine131 = { version = "0.1.0", path = "./crates/engine" }
math131 = { version = "0.1.0", path = "./crates/math", features = [ "SIMD" ] }
renderer131 = { version = "0.1.0", path = "./crates/renderer" }
window131 = { version = "0.1.0", path = "./crates/window", features = [ "GLFW" ] }

editor131 = { version = "0.1.0", path = "./crates/editor" }

# External libraries (dependencies)
anyhow = "1.0.100"
ash = "0.38.0"
