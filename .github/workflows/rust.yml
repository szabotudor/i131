name: Rust

on:
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libglfw3-dev \
          libvulkan-dev \
          vulkan-validationlayers \
          glslc \
          libwayland-dev
  
  check-lint:
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check Lint
      run: cargo fmt --check

  clippy:
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Clippy
      run: cargo clippy

  build:
    needs: deps
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
