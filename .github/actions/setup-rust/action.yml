name: Setup Rust and system dependencies
description: Install the Rust components and I131 native requirements

runs:
  using: composite
  steps:
    - name: Install Rust toolchain components
      uses: dtolnay/rust-toolchain@master
      with:
        components: rustfmt, clippy

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libglfw3-dev \
          libvulkan-dev \
          vulkan-validationlayers \
          glslc \
          libwayland-dev \
          libwayland-bin \
          wayland-protocols \
          libxkbcommon-dev \
          xorg-dev
